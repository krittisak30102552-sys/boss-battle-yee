name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild original source archive
        run: |
          cat .upload-source/part-01.b64 \
            .upload-source/part-02-slices/*.b64 \
            .upload-source/part-03.b64 \
            .upload-source/part-04.b64 \
            .upload-source/part-05.b64 \
            .upload-source/part-06.b64 \
            .upload-source/part-07.b64 \
            .upload-source/part-08.b64 \
            | base64 --decode > game-source.tar.xz

      - name: Verify and extract game project
        run: |
          xz -t game-source.tar.xz
          mkdir -p game
          tar -xJf game-source.tar.xz -C game
          test -f game/package.json
          test -f game/src/main.tsx

      - name: Apply low-glare Mark 85 armor polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("game")

          # Keep the original sleek nanotech armor proportions; only reduce glare.
          p = root / "src/game/Game.ts"
          s = p.read_text()
          for line in (
              'import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";\\n',
              'import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";\\n',
              'import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";\\n',
              'import { OutputPass } from "three/examples/jsm/postprocessing/OutputPass.js";\\n',
          ):
              s = s.replace(line, "")
          s = s.replace("  private composer: EffectComposer;\\n  private bloom: UnrealBloomPass;\\n", "")
          bloom = """    const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
              this.composer = new EffectComposer(this.renderer, rt);
              this.composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
              this.composer.setSize(w, h);
              this.composer.addPass(new RenderPass(this.scene, this.camera));
              this.bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.65, 0.55, 1.0);
              this.composer.addPass(this.bloom);
              this.composer.addPass(new OutputPass());
          """
          if bloom in s:
              s = s.replace(bloom, "")
          s = s.replace("this.renderer.toneMappingExposure = 1.05;", "this.renderer.toneMappingExposure = 0.9;")
          s = s.replace("scene.environmentIntensity = 0.55;", "scene.environmentIntensity = 0.3;")
          s = s.replace("    this.composer.setSize(w, h);\\n    this.bloom.setSize(w, h);\\n", "")
          s = s.replace("    this.composer.dispose();\\n", "")
          s = s.replace("    this.composer.render();", "    this.renderer.render(this.scene, this.camera);")
          p.write_text(s)

          # Correct all UI copy to the sleek Iron Man Mark 85 from Endgame.
          p = root / "src/App.tsx"
          s = p.read_text()
          s = s.replace("MARK 51 · เกราะ", "MARK 85 · NANOTECH")
          s = s.replace("MK-51", "MK-85")
          s = s.replace("MODEL 52 · HULKBUSTER", "MARK 85 · NANOTECH")
          s = s.replace("MODEL 52", "MK-85")
          s = s.replace(
              "สนามรบบนไททัน — สวมเกราะ Hulkbuster Model 52 ที่มีแผ่นเกราะซ้อนหนา ขอบโลหะ และรายละเอียดเกราะแบบคอมิก",
              "สนามรบบนไททัน — สวมเกราะ Iron Man Mark 85 จาก Avengers: Endgame ดีไซน์นาโนเทคสีแดง-ทองทรงเพรียว"
          )
          s = s.replace("drop-shadow-[0_0_20px_rgba(239,68,68,0.6)]", "drop-shadow-[0_0_5px_rgba(239,68,68,0.2)]")
          s = s.replace("drop-shadow-[0_0_24px_rgba(168,85,247,0.7)]", "drop-shadow-[0_0_6px_rgba(168,85,247,0.22)]")
          p.write_text(s)
          PY

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
