name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild original source archive
        run: |
          cat .upload-source/part-01.b64 \
            .upload-source/part-02-slices/*.b64 \
            .upload-source/part-03.b64 \
            .upload-source/part-04.b64 \
            .upload-source/part-05.b64 \
            .upload-source/part-06.b64 \
            .upload-source/part-07.b64 \
            .upload-source/part-08.b64 \
            | base64 --decode > game-source.tar.xz

      - name: Verify and extract game project
        run: |
          xz -t game-source.tar.xz
          mkdir -p game
          tar -xJf game-source.tar.xz -C game
          test -f game/package.json
          test -f game/src/main.tsx

      - name: Replace character models with uploaded Mark 85 model set
        run: |
          test -f implement-mark-85-combat-skills.zip
          mkdir -p /tmp/mark85-models
          unzip -p implement-mark-85-combat-skills.zip src/game/builders.ts > /tmp/mark85-models/builders.ts
          unzip -p implement-mark-85-combat-skills.zip src/game/nano.ts > /tmp/mark85-models/nano.ts
          test -s /tmp/mark85-models/builders.ts
          test -s /tmp/mark85-models/nano.ts
          cp /tmp/mark85-models/builders.ts game/src/game/builders.ts
          cp /tmp/mark85-models/nano.ts game/src/game/nano.ts
          echo "Replaced character models and Mark 85 nanotech equipment system from the uploaded project."

      - name: Apply low-glare Mark 85 armor polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("game")

          # Keep the original sleek nanotech armor proportions; only reduce glare.
          p = root / "src/game/Game.ts"
          s = p.read_text()
          for line in (
              'import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";\n',
              'import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";\n',
              'import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";\n',
              'import { OutputPass } from "three/examples/jsm/postprocessing/OutputPass.js";\n',
          ):
              s = s.replace(line, "")
          s = s.replace("  private composer: EffectComposer;\n  private bloom: UnrealBloomPass;\n", "")
          bloom = """    const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
              this.composer = new EffectComposer(this.renderer, rt);
              this.composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
              this.composer.setSize(w, h);
              this.composer.addPass(new RenderPass(this.scene, this.camera));
              this.bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.65, 0.55, 1.0);
              this.composer.addPass(this.bloom);
              this.composer.addPass(new OutputPass());
          """
          if bloom in s:
              s = s.replace(bloom, "")
          s = s.replace("this.renderer.toneMappingExposure = 1.05;", "this.renderer.toneMappingExposure = 0.9;")
          s = s.replace("scene.environmentIntensity = 0.55;", "scene.environmentIntensity = 0.3;")
          s = s.replace("    this.composer.setSize(w, h);\n    this.bloom.setSize(w, h);\n", "")
          s = s.replace("    this.composer.dispose();\n", "")
          s = s.replace("    this.composer.render();", "    this.renderer.render(this.scene, this.camera);")
          p.write_text(s)

          # Tony Stark mode: show Tony while the Mark 85 becomes an autonomous companion.
          p = root / "src/game/Game.ts"
          s = p.read_text()
          field_anchor = "  private rig: IronRig;\n  private nano: NanoSystem;"
          fields = """  private rig: IronRig;
          private nano: NanoSystem;
          private tonyMode = false;
          private tonyRoot = new THREE.Group();
          private suitAiTimer = 0;
          private suitAnimMode: "none" | "remove-open" | "remove-fly" | "put-fly" | "put-assemble" = "none";
          private suitAnimTimer = 0;"""
          if field_anchor in s and "private tonyMode = false;" not in s:
              s = s.replace(field_anchor, fields)

          build_anchor = "  private buildWorld() {"
          tony_builder = """
          private buildTonyModel() {
            const root = new THREE.Group();
            const skin = new THREE.MeshStandardMaterial({ color: 0xd6a47f, roughness: 0.82 });
            const hair = new THREE.MeshStandardMaterial({ color: 0x4b2d20, roughness: 0.9 });
            const shirt = new THREE.MeshStandardMaterial({ color: 0x252a35, roughness: 0.85 });
            const pants = new THREE.MeshStandardMaterial({ color: 0x27364c, roughness: 0.9 });
            const shoe = new THREE.MeshStandardMaterial({ color: 0x17191e, roughness: 0.9 });
            const part = (geo: THREE.BufferGeometry, mat: THREE.Material, x: number, y: number, z: number) => {
              const mesh = new THREE.Mesh(geo, mat);
              mesh.position.set(x, y, z);
              mesh.castShadow = true;
              mesh.receiveShadow = true;
              root.add(mesh);
              return mesh;
            };
            part(new THREE.BoxGeometry(0.72, 0.92, 0.38), shirt, 0, 1.35, 0);
            part(new THREE.SphereGeometry(0.28, 18, 14), skin, 0, 2.02, 0);
            part(new THREE.SphereGeometry(0.29, 18, 10, 0, Math.PI * 2, 0, Math.PI * 0.52), hair, 0, 2.12, -0.015);
            part(new THREE.BoxGeometry(0.2, 0.72, 0.22), pants, -0.19, 0.52, 0);
            part(new THREE.BoxGeometry(0.2, 0.72, 0.22), pants, 0.19, 0.52, 0);
            part(new THREE.BoxGeometry(0.24, 0.14, 0.36), shoe, -0.19, 0.1, 0.04);
            part(new THREE.BoxGeometry(0.24, 0.14, 0.36), shoe, 0.19, 0.1, 0.04);
            const armL = part(new THREE.CapsuleGeometry(0.105, 0.48, 4, 8), shirt, -0.48, 1.36, 0);
            const armR = part(new THREE.CapsuleGeometry(0.105, 0.48, 4, 8), shirt, 0.48, 1.36, 0);
            armL.rotation.z = -0.12;
            armR.rotation.z = 0.12;
            part(new THREE.SphereGeometry(0.11, 12, 10), skin, -0.5, 0.99, 0);
            part(new THREE.SphereGeometry(0.11, 12, 10), skin, 0.5, 0.99, 0);
            root.visible = false;
            return root;
          }

          """
          if build_anchor in s and "private buildTonyModel()" not in s:
              s = s.replace(build_anchor, tony_builder + build_anchor)
          ctor_anchor = "    this.rig = buildIronMan();\n    this.scene.add(this.rig.root);"
          ctor_new = """    this.rig = buildIronMan();
              this.scene.add(this.rig.root);
              this.tonyRoot = this.buildTonyModel();
              this.scene.add(this.tonyRoot);"""
          if ctor_anchor in s and "this.tonyRoot = this.buildTonyModel();" not in s:
              s = s.replace(ctor_anchor, ctor_new)

          public_methods = """
          toggleSuit() {
            if (this.suitAnimMode !== "none") return this.tonyMode;
            this.suitAnimTimer = 0;
            this.rig.root.visible = true;
            if (!this.tonyMode) {
              this.tonyMode = true;
              this.tonyRoot.visible = true;
              this.suitAnimMode = "remove-open";
              this.rig.root.position.copy(this.pl.pos);
              this.rig.root.rotation.set(0, this.pl.heading, 0);
              for (const part of this.rig.root.children) {
                const data = part.userData as any;
                data.__suitBasePos = part.position.clone();
                data.__suitBaseRot = part.rotation.clone();
                data.__suitBaseScale = part.scale.clone();
              }
            } else {
              this.suitAnimMode = "put-fly";
              this.suitAiTimer = 999;
            }
            return this.tonyMode;
          }

          selectSkill(index: number) {
            this.selectWeapon(Math.max(0, Math.min(3, index)));
          }

          setAttackHeld(held: boolean) {
            this.mouseDown = held;
          }

          touchLook(dx: number, dy: number) {
            this.camYaw -= dx * 0.006;
            this.camPitch = clamp(this.camPitch + dy * 0.006, -0.55, 1.15);
          }

          """
          if "  start() {" in s and "toggleSuit()" not in s:
              s = s.replace("  start() {", public_methods + "  start() {")

          reset_anchor = "    this.rig.body.rotation.set(0, 0, 0);"
          reset_new = """    this.rig.body.rotation.set(0, 0, 0);
              this.tonyMode = false;
              this.tonyRoot.visible = false;
              this.rig.root.visible = true;
              this.suitAiTimer = 0;"""
          if reset_anchor in s and "this.tonyMode = false;" not in s:
              s = s.replace(reset_anchor, reset_new)

          pose_anchor = "  private updatePlayerPose(dt: number) {"
          ai_methods = """
          private updateSuitAssembly(dt: number) {
            if (this.suitAnimMode === "none") return;
            this.suitAnimTimer += dt;
            const root = this.rig.root;
            const parts = root.children;
            if (this.suitAnimMode === "remove-open") {
              const t = Math.min(1, this.suitAnimTimer / 0.72);
              parts.forEach((part, i) => {
                const data = part.userData as any;
                const base = data.__suitBasePos as THREE.Vector3;
                const angle = (i / Math.max(1, parts.length)) * Math.PI * 2;
                const spread = 0.9 * Math.sin(t * Math.PI * 0.5);
                part.position.set(base.x + Math.cos(angle) * spread, base.y + Math.sin(angle * 1.7) * spread, base.z + Math.sin(angle) * spread);
                part.rotation.x = data.__suitBaseRot.x + Math.sin(angle) * t * 0.45;
                part.rotation.y = data.__suitBaseRot.y + t * 0.5;
              });
              if (t >= 1) {
                parts.forEach((part) => {
                  const data = part.userData as any;
                  part.position.copy(data.__suitBasePos);
                  part.rotation.copy(data.__suitBaseRot);
                });
                this.suitAnimMode = "remove-fly";
                this.suitAnimTimer = 0;
              }
              return;
            }
            if (this.suitAnimMode === "remove-fly") {
              const b = this.boss;
              const a = Math.min(1, this.suitAnimTimer / 1.0);
              const orbit = this.time * 0.72;
              const destination = this.v1.set(b.pos.x + Math.cos(orbit) * 7.5, 3.4, b.pos.z + Math.sin(orbit) * 7.5);
              root.position.lerp(destination, Math.min(1, dt * 2.8));
              root.rotation.y = Math.atan2(b.pos.x - root.position.x, b.pos.z - root.position.z);
              if (a >= 1) {
                this.suitAnimMode = "none";
                this.suitAiTimer = 0.35;
              }
              return;
            }
            if (this.suitAnimMode === "put-fly") {
              const t = Math.min(1, this.suitAnimTimer / 0.72);
              const destination = this.pl.pos.clone();
              destination.y = 0;
              root.position.lerp(destination, Math.min(1, dt * 4.5));
              root.rotation.y = this.pl.heading;
              if (t >= 1) {
                parts.forEach((part, i) => {
                  const data = part.userData as any;
                  data.__suitBasePos ??= part.position.clone();
                  data.__suitBaseRot ??= part.rotation.clone();
                  data.__suitBaseScale ??= part.scale.clone();
                  const angle = (i / Math.max(1, parts.length)) * Math.PI * 2;
                  part.position.copy(data.__suitBasePos).add(new THREE.Vector3(Math.cos(angle) * 2.2, 1.1 + (i % 3) * 0.35, Math.sin(angle) * 2.2));
                  data.__suitStartPos = part.position.clone();
                  part.visible = true;
                  part.scale.setScalar(0.001);
                });
                this.suitAnimMode = "put-assemble";
                this.suitAnimTimer = 0;
              }
              return;
            }
            if (this.suitAnimMode === "put-assemble") {
              const pieceDelay = 0.13;
              const duration = 0.42;
              parts.forEach((part, i) => {
                const data = part.userData as any;
                const local = this.suitAnimTimer - i * pieceDelay;
                const t = Math.max(0, Math.min(1, local / duration));
                part.visible = local >= 0;
                const baseScale = data.__suitBaseScale as THREE.Vector3;
                if (part.visible) {
                  const ease = t * (2 - t);
                  part.position.lerp(data.__suitBasePos, ease);
                  part.scale.copy(baseScale).multiplyScalar(0.001 + 0.999 * ease);
                }
                if (t >= 1) {
                  part.position.copy(data.__suitBasePos);
                  part.rotation.copy(data.__suitBaseRot);
                }
              });
              if (this.suitAnimTimer >= (Math.max(0, parts.length - 1) * pieceDelay + duration)) {
                parts.forEach((part) => {
                  const data = part.userData as any;
                  part.visible = true;
                  part.position.copy(data.__suitBasePos);
                  part.rotation.copy(data.__suitBaseRot);
                  part.scale.copy(data.__suitBaseScale);
                });
                root.position.copy(this.pl.pos);
                root.rotation.set(0, this.pl.heading, 0);
                this.tonyMode = false;
                this.tonyRoot.visible = false;
                this.suitAnimMode = "none";
                this.suitAiTimer = 0;
              }
            }
          }

          private updateSuitCompanion(dt: number) {
            if (!this.tonyMode || this.suitAnimMode !== "none" || this.boss.state === "dead") return;
            const b = this.boss;
            const r = this.rig.root;
            const orbit = this.time * 0.72;
            const target = this.v1.set(
              b.pos.x + Math.cos(orbit) * 7.5,
              3.4 + Math.sin(this.time * 2.1) * 0.8,
              b.pos.z + Math.sin(orbit) * 7.5
            );
            r.position.lerp(target, Math.min(1, dt * 2.8));
            r.rotation.y = Math.atan2(b.pos.x - r.position.x, b.pos.z - r.position.z);
            r.rotation.x = -0.08;
            for (const flame of this.rig.flames) {
              flame.visible = true;
              flame.scale.set(0.8, 0.75 + Math.sin(this.time * 18) * 0.15, 0.8);
            }
            this.suitAiTimer -= dt;
            if (this.suitAiTimer <= 0) {
              this.suitAiTimer = 1.15;
              const from = r.position.clone().add(new THREE.Vector3(0, 1.65, 0));
              const targetPoint = b.pos.clone().add(new THREE.Vector3(0, 3.7, 0));
              const dir = targetPoint.sub(from).normalize();
              const beam = new THREE.Mesh(this.boltGeo, this.boltMat);
              beam.position.copy(from);
              beam.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
              this.scene.add(beam);
              this.projs.push({ mesh: beam, vel: dir.multiplyScalar(78), life: 1.7, dmg: 10, owner: "p", r: 0.32, kind: "bolt", power: 0 });
              this.fx.spawn(from.x, from.y, from.z, dir.x * 5, dir.y * 5, dir.z * 5, 0.22, 0.14, new THREE.Color(0.8, 2, 2.8));
            }
          }

          """
          if pose_anchor in s and "private updateSuitCompanion(dt: number)" not in s:
              s = s.replace(pose_anchor, ai_methods + pose_anchor)
          pose_branch = """    const dead = this.status === "lost";

              r.root.position.copy(p.pos);"""
          pose_branch_new = """    const dead = this.status === "lost";
              if (this.tonyMode) {
                this.tonyRoot.position.copy(p.pos);
                this.tonyRoot.position.y += Math.sin(this.time * 5) * 0.025;
                this.tonyRoot.rotation.y = p.heading;
                return;
              }

              r.root.position.copy(p.pos);"""
          if pose_branch in s:
              s = s.replace(pose_branch, pose_branch_new)
          s = s.replace("    this.updatePlayerPose(dt);\n", "    this.updatePlayerPose(dt);\n    this.updateSuitAssembly(dt);\n    this.updateSuitCompanion(dt);\n")
          p.write_text(s)

          # Correct all UI copy to the sleek Iron Man Mark 85 from Endgame.
          p = root / "src/App.tsx"
          s = p.read_text()
          s = s.replace("MARK 51 · เกราะ", "MARK 85 · NANOTECH")
          s = s.replace("MK-51", "MK-85")
          s = s.replace("          <DownloadButtons />", "")
          s = s.replace("MODEL 52 · HULKBUSTER", "MARK 85 · NANOTECH")
          s = s.replace("MODEL 52", "MK-85")
          s = s.replace(
              "สนามรบบนไททัน — สวมเกราะ Hulkbuster Model 52 ที่มีแผ่นเกราะซ้อนหนา ขอบโลหะ และรายละเอียดเกราะแบบคอมิก",
              "สนามรบบนไททัน — สวมเกราะ Iron Man Mark 85 จาก Avengers: Endgame ดีไซน์นาโนเทคสีแดง-ทองทรงเพรียว"
          )
          s = s.replace("drop-shadow-[0_0_20px_rgba(239,68,68,0.6)]", "drop-shadow-[0_0_5px_rgba(239,68,68,0.2)]")
          s = s.replace("drop-shadow-[0_0_24px_rgba(168,85,247,0.7)]", "drop-shadow-[0_0_6px_rgba(168,85,247,0.22)]")
          p.write_text(s)

          # Add a device chooser and touch movement/camera controls to the React UI.
          p = root / "src/App.tsx"
          s = p.read_text()
          state_anchor = 'const [error, setError] = useState("");'
          state_idx = s.find(state_anchor)
          if state_idx >= 0 and 'const [chooseMode, setChooseMode]' not in s:
              state_end = state_idx + len(state_anchor)
              s = s[:state_end] + '\n  const [chooseMode, setChooseMode] = useState(false);\n  const [deviceMode, setDeviceMode] = useState<"desktop" | "mobile" | null>(null);' + s[state_end:]
          start_anchor = 'onClick={() => gameRef.current?.start()}'
          start_idx = s.find(start_anchor)
          if start_idx >= 0:
              s = s[:start_idx] + 'onClick={() => setChooseMode(true)}' + s[start_idx + len(start_anchor):]
          print("State anchor/start anchor:", state_idx, start_idx)
          chooser = """
                {chooseMode && (
                  <div className="fixed inset-0 z-[99999] flex items-center justify-center bg-black/95 p-5">
                    <div className="w-full max-w-xl border border-amber-300/50 bg-slate-950/95 p-6 text-center shadow-2xl">
                      <div className="text-amber-300 text-xs font-black tracking-[0.35em]">SELECT CONTROL MODE</div>
                      <h2 className="mt-3 text-2xl sm:text-3xl font-black">เล่นบนอุปกรณ์ไหน?</h2>
                      <p className="mt-2 text-sm text-white/60">เลือกวิธีควบคุมก่อนเข้าสู่สนาม</p>
                      <div className="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onClick={() => { setDeviceMode("desktop"); setChooseMode(false); gameRef.current?.start(); }}
                          className="border border-cyan-300/60 bg-cyan-500/10 p-5 text-left hover:bg-cyan-500/20 active:scale-95">
                          <div className="text-4xl">🖥️</div><div className="mt-2 text-lg font-black">คอมพิวเตอร์</div>
                          <div className="text-xs text-white/60">คีย์บอร์ด + เมาส์</div>
                        </button>
                        <button onClick={() => { setDeviceMode("mobile"); setChooseMode(false); gameRef.current?.start(); }}
                          className="border border-amber-300/60 bg-amber-500/10 p-5 text-left hover:bg-amber-500/20 active:scale-95">
                          <div className="text-4xl">📱</div><div className="mt-2 text-lg font-black">โทรศัพท์</div>
                          <div className="text-xs text-white/60">ปุ่มสัมผัสบนหน้าจอ</div>
                        </button>
                      </div>
                      <button onClick={() => setChooseMode(false)} className="mt-5 px-5 py-2 text-sm text-white/60 hover:text-white">← กลับ</button>
                    </div>
                  </div>
                )}
          """
          anchor = 'PAUSE ---------------- */}'
          if anchor in s and 'SELECT CONTROL MODE' not in s:
              idx = s.index(anchor)
              line_start = s.rfind(chr(10), 0, idx) + 1
              s = s[:line_start] + chooser + chr(10) + s[line_start:]

          mobile = """
                {showHud && deviceMode === "mobile" && hud.status === "playing" && (
                  <div className="pointer-events-none absolute inset-0 z-20 touch-none">
                    <div className="pointer-events-auto absolute bottom-24 left-3 grid grid-cols-3 gap-1.5">
                      <span />
                      {holdKey("KeyW", "▲", "col-start-2")}
                      <span />
                      {holdKey("KeyA", "◀", "")}
                      {holdKey("KeyS", "▼", "")}
                      {holdKey("KeyD", "▶", "")}
                    </div>
                    <div className="pointer-events-auto absolute bottom-24 right-3 flex flex-col items-center gap-2">
                      {holdKey("Space", "กระโดด / บิน", "w-28 h-14 text-xs")}
                      {holdKey("ShiftLeft", "พุ่งหลบ", "w-28 h-11 text-xs")}
                      <div className="grid grid-cols-3 gap-1">
                        <span />
                        {holdKey("ArrowUp", "กล้อง ▲", "w-12 h-10 text-[10px]")}
                        <span />
                        {holdKey("ArrowLeft", "◀", "w-12 h-10")}
                        {holdKey("ArrowDown", "▼", "w-12 h-10")}
                        {holdKey("ArrowRight", "▶", "w-12 h-10")}
                      </div>
                    </div>
                  </div>
                )}
          """
          # Add a small helper that emits the same keyboard events the game already listens for.
          helper_anchor = '  const bossPct = hud.bossHp / hud.bossMax;'
          helper = '''
          const holdKey = (code: string, label: string, extra = "") => (
            <button key={code} type="button"
              onPointerDown={(e) => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); document.dispatchEvent(new KeyboardEvent("keydown", { code, key: code.startsWith("Key") ? code.slice(3).toLowerCase() : code === "Space" ? " " : code.startsWith("Arrow") ? code.slice(5).toLowerCase() : code === "ShiftLeft" ? "Shift" : code, bubbles: true })); }}
              onPointerUp={() => document.dispatchEvent(new KeyboardEvent("keyup", { code, key: code.startsWith("Key") ? code.slice(3).toLowerCase() : code === "Space" ? " " : code.startsWith("Arrow") ? code.slice(5).toLowerCase() : code === "ShiftLeft" ? "Shift" : code, bubbles: true }))}
              onPointerCancel={() => document.dispatchEvent(new KeyboardEvent("keyup", { code, key: code.startsWith("Key") ? code.slice(3).toLowerCase() : code === "Space" ? " " : code.startsWith("Arrow") ? code.slice(5).toLowerCase() : code === "ShiftLeft" ? "Shift" : code, bubbles: true }))}
              onLostPointerCapture={() => document.dispatchEvent(new KeyboardEvent("keyup", { code, key: code.startsWith("Key") ? code.slice(3).toLowerCase() : code === "Space" ? " " : code.startsWith("Arrow") ? code.slice(5).toLowerCase() : code === "ShiftLeft" ? "Shift" : code, bubbles: true }))}
              onContextMenu={(e) => e.preventDefault()}
              className={`h-12 w-12 rounded-xl border border-white/35 bg-black/65 text-lg font-black text-white shadow-lg active:bg-cyan-500/50 active:scale-95 ${extra}`}>
              {label}
            </button>
          );
          '''
          if helper_anchor in s and 'const holdKey = ' not in s:
              s = s.replace(helper_anchor, helper + '\n  ' + helper_anchor)
          # Insert touch overlay inside the main app, immediately before the menu.
          menu_anchor = 'MENU ---------------- */}'
          if menu_anchor in s and 'deviceMode === "mobile"' not in s:
              idx = s.index(menu_anchor)
              line_start = s.rfind(chr(10), 0, idx) + 1
