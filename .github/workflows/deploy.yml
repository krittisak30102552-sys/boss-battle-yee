                      </div>
                      <div className="grid w-full grid-cols-2 gap-1">''', 1)
          # Smaller touch action buttons to leave more room for the game view.
          s = s.replace('px-4 py-3 text-sm font-black', 'px-2 py-2 text-xs font-black')
          s = s.replace('px-3 py-3 text-xs font-black', 'px-2 py-2 text-[10px] font-black')
          s = s.replace('w-full h-11 text-xs', 'w-full h-9 text-[10px]')
