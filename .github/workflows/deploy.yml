name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Rebuild original source archive
        run: |
          cat .upload-source/part-01.b64 \
            .upload-source/part-02-slices/*.b64 \
            .upload-source/part-03.b64 \
            .upload-source/part-04.b64 \
            .upload-source/part-05.b64 \
            .upload-source/part-06.b64 \
            .upload-source/part-07.b64 \
            .upload-source/part-08.b64 \
            | base64 --decode > game-source.tar.xz

      - name: Verify and extract game project
        run: |
          xz -t game-source.tar.xz
          mkdir -p game
          tar -xJf game-source.tar.xz -C game
          test -f game/package.json
          test -f game/src/main.tsx

      - name: Apply low-glare Mark 85 armor polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("game")

          # Keep the original sleek nanotech armor proportions; only reduce glare.
          p = root / "src/game/Game.ts"
          s = p.read_text()
          for line in (
              'import { EffectComposer } from "three/examples/jsm/postprocessing/EffectComposer.js";\n',
              'import { RenderPass } from "three/examples/jsm/postprocessing/RenderPass.js";\n',
              'import { UnrealBloomPass } from "three/examples/jsm/postprocessing/UnrealBloomPass.js";\n',
              'import { OutputPass } from "three/examples/jsm/postprocessing/OutputPass.js";\n',
          ):
              s = s.replace(line, "")
          s = s.replace("  private composer: EffectComposer;\n  private bloom: UnrealBloomPass;\n", "")
          bloom = """    const rt = new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType, samples: 4 });
              this.composer = new EffectComposer(this.renderer, rt);
              this.composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
              this.composer.setSize(w, h);
              this.composer.addPass(new RenderPass(this.scene, this.camera));
              this.bloom = new UnrealBloomPass(new THREE.Vector2(w, h), 0.65, 0.55, 1.0);
              this.composer.addPass(this.bloom);
              this.composer.addPass(new OutputPass());
          """
          if bloom in s:
              s = s.replace(bloom, "")
          s = s.replace("this.renderer.toneMappingExposure = 1.05;", "this.renderer.toneMappingExposure = 0.9;")
          s = s.replace("scene.environmentIntensity = 0.55;", "scene.environmentIntensity = 0.3;")
          s = s.replace("    this.composer.setSize(w, h);\n    this.bloom.setSize(w, h);\n", "")
          s = s.replace("    this.composer.dispose();\n", "")
          s = s.replace("    this.composer.render();", "    this.renderer.render(this.scene, this.camera);")
          p.write_text(s)

          # Correct all UI copy to the sleek Iron Man Mark 85 from Endgame.
          p = root / "src/App.tsx"
          s = p.read_text()
          s = s.replace("MARK 51 · เกราะ", "MARK 85 · NANOTECH")
          s = s.replace("MK-51", "MK-85")
          s = s.replace("          <DownloadButtons />", "")
          s = s.replace("MODEL 52 · HULKBUSTER", "MARK 85 · NANOTECH")
          s = s.replace("MODEL 52", "MK-85")
          s = s.replace(
              "สนามรบบนไททัน — สวมเกราะ Hulkbuster Model 52 ที่มีแผ่นเกราะซ้อนหนา ขอบโลหะ และรายละเอียดเกราะแบบคอมิก",
              "สนามรบบนไททัน — สวมเกราะ Iron Man Mark 85 จาก Avengers: Endgame ดีไซน์นาโนเทคสีแดง-ทองทรงเพรียว"
          )
          s = s.replace("drop-shadow-[0_0_20px_rgba(239,68,68,0.6)]", "drop-shadow-[0_0_5px_rgba(239,68,68,0.2)]")
          s = s.replace("drop-shadow-[0_0_24px_rgba(168,85,247,0.7)]", "drop-shadow-[0_0_6px_rgba(168,85,247,0.22)]")
          p.write_text(s)

          # Add a device chooser and touch movement/camera controls to the React UI.
          p = root / "src/App.tsx"
          s = p.read_text()
          s = s.replace(
              '  const [error, setError] = useState("");',
              '  const [error, setError] = useState("");\n  const [chooseMode, setChooseMode] = useState(false);\n  const [deviceMode, setDeviceMode] = useState<"desktop" | "mobile" | null>(null);'
          )
          s = s.replace(
              'onClick={() => gameRef.current?.start()}',
              'onClick={() => setChooseMode(true)}'
          )
          chooser = """
                {chooseMode && (
                  <div className="fixed inset-0 z-[99999] flex items-center justify-center bg-black/95 p-5">
                    <div className="w-full max-w-xl border border-amber-300/50 bg-slate-950/95 p-6 text-center shadow-2xl">
                      <div className="text-amber-300 text-xs font-black tracking-[0.35em]">SELECT CONTROL MODE</div>
                      <h2 className="mt-3 text-2xl sm:text-3xl font-black">เล่นบนอุปกรณ์ไหน?</h2>
                      <p className="mt-2 text-sm text-white/60">เลือกวิธีควบคุมก่อนเข้าสู่สนาม</p>
                      <div className="mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <button onClick={() => { setDeviceMode("desktop"); setChooseMode(false); gameRef.current?.start(); }}
                          className="border border-cyan-300/60 bg-cyan-500/10 p-5 text-left hover:bg-cyan-500/20 active:scale-95">
                          <div className="text-4xl">🖥️</div><div className="mt-2 text-lg font-black">คอมพิวเตอร์</div>
                          <div className="text-xs text-white/60">คีย์บอร์ด + เมาส์</div>
                        </button>
                        <button onClick={() => { setDeviceMode("mobile"); setChooseMode(false); gameRef.current?.start(); }}
                          className="border border-amber-300/60 bg-amber-500/10 p-5 text-left hover:bg-amber-500/20 active:scale-95">
                          <div className="text-4xl">📱</div><div className="mt-2 text-lg font-black">โทรศัพท์</div>
                          <div className="text-xs text-white/60">ปุ่มสัมผัสบนหน้าจอ</div>
                        </button>
                      </div>
                      <button onClick={() => setChooseMode(false)} className="mt-5 px-5 py-2 text-sm text-white/60 hover:text-white">← กลับ</button>
                    </div>
                  </div>
                )}
          """
          anchor = '      {/* ---------------- PAUSE ---------------- */}'
          if anchor in s and 'SELECT CONTROL MODE' not in s:
              s = s.replace(anchor, chooser + '\n      ' + anchor)

          mobile = """
                {showHud && deviceMode === "mobile" && hud.status === "playing" && (
                  <div className="pointer-events-none absolute inset-0 z-20 touch-none">
                    <div className="pointer-events-auto absolute bottom-24 left-3 grid grid-cols-3 gap-1.5">
                      <span />
                      {holdKey("KeyW", "▲", "col-start-2")}
                      <span />
                      {holdKey("KeyA", "◀", "")}
                      {holdKey("KeyS", "▼", "")}
                      {holdKey("KeyD", "▶", "")}
                    </div>
                    <div className="pointer-events-auto absolute bottom-24 right-3 flex flex-col items-center gap-2">
                      {holdKey("Space", "กระโดด / บิน", "w-28 h-14 text-xs")}
                      {holdKey("ShiftLeft", "พุ่งหลบ", "w-28 h-11 text-xs")}
                      <div className="grid grid-cols-3 gap-1">
                        <span />
                        {holdKey("ArrowUp", "กล้อง ▲", "w-12 h-10 text-[10px]")}
                        <span />
                        {holdKey("ArrowLeft", "◀", "w-12 h-10")}
                        {holdKey("ArrowDown", "▼", "w-12 h-10")}
                        {holdKey("ArrowRight", "▶", "w-12 h-10")}
                      </div>
                    </div>
                  </div>
                )}
          """
          # Add a small helper that emits the same keyboard events the game already listens for.
          helper_anchor = '  const bossPct = hud.bossHp / hud.bossMax;'
          helper = '''
          const holdKey = (code: string, label: string, extra = "") => (
            <button key={code} type="button"
              onPointerDown={(e) => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); window.dispatchEvent(new KeyboardEvent("keydown", { code, bubbles: true })); }}
              onPointerUp={() => window.dispatchEvent(new KeyboardEvent("keyup", { code, bubbles: true }))}
              onPointerCancel={() => window.dispatchEvent(new KeyboardEvent("keyup", { code, bubbles: true }))}
              onLostPointerCapture={() => window.dispatchEvent(new KeyboardEvent("keyup", { code, bubbles: true }))}
              onContextMenu={(e) => e.preventDefault()}
              className={`h-12 w-12 rounded-xl border border-white/35 bg-black/65 text-lg font-black text-white shadow-lg active:bg-cyan-500/50 active:scale-95 ${extra}`}>
              {label}
            </button>
          );
          '''
          if helper_anchor in s and 'const holdKey = ' not in s:
              s = s.replace(helper_anchor, helper + '\n  ' + helper_anchor)
          # Insert touch overlay inside the main app, immediately before the menu.
          menu_anchor = '      {/* ---------------- MENU ---------------- */}'
          if menu_anchor in s and 'deviceMode === "mobile"' not in s:
              s = s.replace(menu_anchor, mobile + '\n      ' + menu_anchor)

          # Upgrade touch controls: circular joystick for movement and swipe-to-look camera.
          p = root / "src/App.tsx"
          s = p.read_text()
          s = s.replace('absolute bottom-24 left-3 grid grid-cols-3 gap-1.5', 'hidden')
          s = s.replace('<div className="grid grid-cols-3 gap-1">', '<div className="hidden">')
          helper_anchor = '  const bossPct = hud.bossHp / hud.bossMax;'
          helpers = """
          const cameraTouchRef = useRef<{ x: number; y: number } | null>(null);
          const virtualKeysRef = useRef<Set<string>>(new Set());
          const setVirtualKey = (code: string, down: boolean) => {
            const held = virtualKeysRef.current.has(code);
            if (down && !held) {
              virtualKeysRef.current.add(code);
              window.dispatchEvent(new KeyboardEvent("keydown", { code, bubbles: true }));
            } else if (!down && held) {
              virtualKeysRef.current.delete(code);
              window.dispatchEvent(new KeyboardEvent("keyup", { code, bubbles: true }));
            }
          };
          const moveStick = (e: React.PointerEvent<HTMLDivElement>) => {
            const rect = e.currentTarget.getBoundingClientRect();
            const dx = e.clientX - (rect.left + rect.width / 2);
            const dy = e.clientY - (rect.top + rect.height / 2);
            const max = rect.width * 0.34;
            const distance = Math.hypot(dx, dy) || 1;
            const scale = Math.min(1, max / distance);
            const x = dx * scale, y = dy * scale;
            const knob = e.currentTarget.querySelector<HTMLElement>("[data-stick-knob]");
            if (knob) knob.style.transform = "translate(" + x + "px," + y + "px)";
            const dead = rect.width * 0.13;
            setVirtualKey("KeyA", x < -dead);
            setVirtualKey("KeyD", x > dead);
            setVirtualKey("KeyW", y < -dead);
            setVirtualKey("KeyS", y > dead);
          };
          const releaseStick = () => {
            ["KeyW", "KeyA", "KeyS", "KeyD"].forEach((code) => setVirtualKey(code, false));
            const knob = document.querySelector<HTMLElement>("[data-stick-knob]");
            if (knob) knob.style.transform = "translate(0px,0px)";
          };
          """
          if helper_anchor in s and "const cameraTouchRef" not in s:
              s = s.replace(helper_anchor, helpers + "\n  " + helper_anchor)
          mobile_anchor = '      {/* ---------------- MENU ---------------- */}'
          overlay = """
                {showHud && deviceMode === "mobile" && hud.status === "playing" && (
                  <>
                    <div className="pointer-events-auto absolute bottom-7 left-5 z-30 flex h-36 w-36 touch-none items-center justify-center rounded-full border-2 border-white/40 bg-black/40 shadow-xl"
                      onPointerDown={(e) => { e.preventDefault(); e.currentTarget.setPointerCapture(e.pointerId); moveStick(e); }}
                      onPointerMove={(e) => { if (e.buttons || e.pressure > 0) moveStick(e); }}
                      onPointerUp={releaseStick} onPointerCancel={releaseStick} onLostPointerCapture={releaseStick}>
                      <div className="pointer-events-none absolute h-24 w-24 rounded-full border border-white/25" />
                      <div data-stick-knob className="pointer-events-none absolute h-14 w-14 rounded-full border-2 border-cyan-200 bg-cyan-400/50 shadow-lg" />
                    </div>
                    <div className="pointer-events-auto absolute inset-y-0 right-0 z-10 w-1/2 touch-none"
                      onPointerDown={(e) => { cameraTouchRef.current = { x: e.clientX, y: e.clientY }; e.currentTarget.setPointerCapture(e.pointerId); }}
                      onPointerMove={(e) => {
                        const prev = cameraTouchRef.current;
                        if (!prev) return;
                        const dx = e.clientX - prev.x, dy = e.clientY - prev.y;
                        cameraTouchRef.current = { x: e.clientX, y: e.clientY };
                        window.dispatchEvent(new MouseEvent("mousemove", { bubbles: true, movementX: dx, movementY: dy }));
                      }}
                      onPointerUp={() => { cameraTouchRef.current = null; }}
                      onPointerCancel={() => { cameraTouchRef.current = null; }}
                    />
                    <div className="pointer-events-none absolute bottom-3 right-4 z-30 text-[10px] font-bold text-white/60">ลากฝั่งขวาเพื่อหมุนกล้อง</div>
                  </>
                )}
          """
          if mobile_anchor in s and "data-stick-knob" not in s:
              s = s.replace(mobile_anchor, overlay + "\n      " + mobile_anchor)
          p.write_text(s)

          # Correct remaining armor labels while preserving the original game model.
          s = s.replace("MARK 51 · เกราะ", "MARK 85 · NANOTECH")
          s = s.replace("MK-51", "MK-85")
          p.write_text(s)
          PY

      - name: Inspect extracted App component
        working-directory: game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("src/App.tsx").read_text().splitlines()
          keys = ("useState", "gameRef.current", "เริ่มเกม", "MENU", "PAUSE", "bossPct", "const [error", "return (", "DownloadButtons")
          for i, line in enumerate(s, 1):
              if any(k in line for k in keys):
                  print(f"{i}: {line[:240]}")
          PY

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: game/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
