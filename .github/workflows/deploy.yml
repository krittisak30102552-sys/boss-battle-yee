name: Deploy game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: game/package-lock.json

      - name: Rebuild original source archive
        run: |
          cat .upload-source/part-01.b64 \
            .upload-source/part-02-slices/*.b64 \
            .upload-source/part-03.b64 \
            .upload-source/part-04.b64 \
            .upload-source/part-05.b64 \
            .upload-source/part-06.b64 \
            .upload-source/part-07.b64 \
            .upload-source/part-08.b64 \
            | base64 --decode > game-source.tar.xz

      - name: Verify and extract game project
        run: |
          xz -t game-source.tar.xz
          mkdir -p game
          tar -xJf game-source.tar.xz -C game
          test -f game/package.json
          test -f game/src/main.tsx

      - name: Install dependencies
        working-directory: game
        run: npm ci

      - name: Build game
        working-directory: game
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: game/dist

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
